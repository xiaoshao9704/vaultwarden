name: Fork passkey candidate images

on:
  push:
    branches: [passkey-pr7370, main]
  pull_request:
    branches: [passkey-pr7370]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_VERSION: "1.37.3"

concurrency:
  group: fork-passkey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test linux/${{ matrix.arch }}
    if: github.repository == 'xiaoshao9704/vaultwarden'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      ARCH: ${{ matrix.arch }}
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # upstream-pinned v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # upstream-pinned v4.3.0
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Generate tested Alpine build
        run: python3 ci/pr7370-build-dockerfile.py
      - name: Build with locked dependencies and Rust unit tests
        run: |
          set -euo pipefail
          image="ghcr.io/${SOURCE_REPOSITORY,,}"
          short="${SOURCE_COMMIT:0:12}"
          tag="${BASE_VERSION}-passkey-${short}-${ARCH}"
          echo "IMAGE=$image:$tag" >> "$GITHUB_ENV"
          echo "IMAGE_REPOSITORY=$image" >> "$GITHUB_ENV"
          docker buildx build --pull --load --provenance=false \
            --platform "linux/$ARCH" \
            --file docker/Dockerfile.pr7370-ci \
            --build-arg DB=sqlite,mysql,postgresql,enable_mimalloc \
            --build-arg "VW_VERSION=${BASE_VERSION}-passkey.${short}" \
            --build-arg CARGO_PROFILE=release \
            --label "org.opencontainers.image.source=https://github.com/$SOURCE_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "org.opencontainers.image.version=${BASE_VERSION}-passkey.${short}" \
            --label "org.opencontainers.image.description=Experimental PR7370 hardening candidate; not upstream official" \
            --tag "$image:$tag" .
      - name: Synthetic official-image upgrade and runtime smoke tests
        env:
          BASELINE_IMAGE: vaultwarden/server:${{ env.BASE_VERSION }}
        run: bash ci/pr7370-smoke.sh
      - name: Authenticate to GHCR (never on pull requests)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # upstream-pinned v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested per-architecture candidate
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          {
            echo "### linux/$ARCH"
            echo "Image: \`$IMAGE\`"
            docker image inspect "$IMAGE" --format 'Uncompressed local image size: {{.Size}} bytes'
            docker image inspect "$IMAGE" --format 'Digest references: {{json .RepoDigests}}'
          } >> "$GITHUB_STEP_SUMMARY"

  manifest:
    name: Publish two-platform candidate manifest
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble only after both architectures pass
        run: |
          set -euo pipefail
          image="ghcr.io/${SOURCE_REPOSITORY,,}"
          short="${SOURCE_COMMIT:0:12}"
          tag="${BASE_VERSION}-passkey-${short}"
          extra_tag=()
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            extra_tag=(--tag "$image:${BASE_VERSION}-passkey")
          fi
          docker buildx imagetools create \
            --tag "$image:$tag" "${extra_tag[@]}" \
            "$image:$tag-amd64" "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag"
          docker buildx imagetools inspect "$image:$tag" --raw > manifest.json
          python3 - <<'PY'
          import json
          m = json.load(open('manifest.json'))
          platforms = {(x['platform']['os'], x['platform']['architecture']) for x in m['manifests']}
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          PY
          {
            echo "### Multi-platform ${BASE_VERSION} passkey image"
            echo "\`$image:$tag\`"
            if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
              echo "Stable alias: \`$image:${BASE_VERSION}-passkey\`"
            fi
            echo 'Pin the manifest digest for rollback-safe deployment.'
          } >> "$GITHUB_STEP_SUMMARY"
